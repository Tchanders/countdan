<!DOCTYPE html>
<html>

<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link href="lib/bootstrap/css/style.css" rel="stylesheet">
	<link rel="apple-touch-icon-precomposed" href="images/icons/phoneicon.png">

	<title>Countdan</title>

</head>

<body>

	<nav class="navbar navbar-expand-md countdan-navbar">
		<div class="container">
			<a href="#" class="navbar-brand">Countdan</a>
			<button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#countdan-menu" aria-controls="countdan-menu" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="countdan-menu">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item">
						<a href="#" class="nav-link">Letters</a>
					</li>
					<li class="nav-item">
						<a href="#numbers" class="nav-link">Numbers</a>
					</li>
					<li class="nav-item">
						<a href="#conundrum" class="nav-link">Conundrum</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container countdan-container">
		<div class="row">
			<div class="col-lg-8 countdan-col">
				<div class="countdan-panel game-panel">
					<h3 class="game-title"></h3>
					<hr>
					<div class="game-content"></div>
				</div>
			</div>
			<div class="col-lg-4 countdan-col">
				<div class="countdan-panel clock-panel"></div>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-8 countdan-col">
				<div class="countdan-panel rules-panel">
					<h3>Rules</h3>
					<hr>
					<ul class="rules-list"></ul>
				</div>
			</div>
			<div class="col-lg-4 countdan-col">
				<div class="countdan-panel solutions-panel">
					<h3>Solutions</h3>
					<hr>
					<div class="ingame-button gamepage-button gamepage-showsolutions button-disabled">Show solutions</div>
					<div class="gamepage-solutions"></div>
				</div>
			</div>
		</div>
	</div>

	<!-- Libs -->
	<script src="lib/js/jquery-4.0.0.min.js"></script>
	<script src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>

	<script src="js/countdan.js"></script>
	<!-- Clock -->
	<script src="js/clock.js"></script>
	<!-- Numbers -->
	<script src="js/numbersgame.js"></script>
	<script src="js/numbersgamesetup.js"></script>
	<!-- Letters -->
	<script src="js/letters.js"></script>
	<script src="js/lettersgame.js"></script>
	<script src="js/lettersgamesetup.js"></script>
	<!-- Conundrum -->
	<script src="js/conundrumsetup.js"></script>

</body>
</html>
